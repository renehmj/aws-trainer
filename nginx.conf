server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The project directory is mounted whole (see docker-compose.yml), so hide the
    # files that are not part of the app.
    location ~* \.(md|ya?ml|conf)$        { return 404; }
    location = /Dockerfile                { return 404; }
    location ~ /\.                        { return 404; }

    # The bank is edited constantly during study. Never let a browser cache it,
    # otherwise new questions appear only after a hard refresh.
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/html text/css application/javascript;
}
